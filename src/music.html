<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxlware Player</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
/* ══════════════════════════════════════════════
   VARIABLES & RESET
══════════════════════════════════════════════ */
:root {
  --c1: #6e48aa;
  --c2: #4fc3f7;
  --c3: #f472b6;
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
  --sans: 'Syne', sans-serif;
  --mono: 'Syne Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--sans);
  color: #fff;
  user-select: none;
}

/* ══════════════════════════════════════════════
   DYNAMIC BACKGROUND
══════════════════════════════════════════════ */
#bg {
  position: fixed; inset: 0; z-index: 0;
  background: #08080f;
  overflow: hidden;
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.55;
  transition: transform 0.08s linear;
  will-change: transform;
}

#blob1 { width: 600px; height: 600px; background: var(--c1); top: -150px; left: -100px; animation: drift1 18s ease-in-out infinite; }
#blob2 { width: 500px; height: 500px; background: var(--c2); bottom: -100px; right: -80px; animation: drift2 22s ease-in-out infinite; }
#blob3 { width: 400px; height: 400px; background: var(--c3); top: 30%; left: 40%; animation: drift3 15s ease-in-out infinite; }

@keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(80px,60px) scale(1.15)} }
@keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-60px,-80px) scale(1.2)} }
@keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(50px,-40px) scale(1.1)} 66%{transform:translate(-40px,50px) scale(0.9)} }

/* Grain overlay */
#bg::after {
  content: '';
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.35;
  pointer-events: none;
}

/* ══════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════ */
#app {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  display: grid;
  grid-template-rows: 1fr auto;
  grid-template-columns: 1fr 340px;
  grid-template-areas:
    "player  playlist"
    "spec    spec";
  gap: 16px;
  padding: 20px 20px 16px;
}

/* ══════════════════════════════════════════════
   GLASS MIXIN
══════════════════════════════════════════════ */
.glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow: var(--glass-shadow);
  border-radius: 20px;
}

/* ══════════════════════════════════════════════
   PLAYER PANEL
══════════════════════════════════════════════ */
#player-panel {
  grid-area: player;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 2rem;
  gap: 1.5rem;
  position: relative;
  overflow: hidden;
}

/* Album art */
#art-wrap {
  position: relative;
  width: clamp(160px, 22vw, 260px);
  flex-shrink: 0;
}

#art-ring {
  position: absolute; inset: -6px;
  border-radius: 50%;
  background: conic-gradient(var(--c1), var(--c2), var(--c3), var(--c1));
  animation: spin 8s linear infinite;
  opacity: 0;
  transition: opacity 0.4s;
}

#art-ring.spinning { opacity: 0.7; }
@keyframes spin { to { transform: rotate(360deg); } }

#art-mask {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  overflow: hidden;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  z-index: 1;
  transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
}

#art-mask:hover { transform: scale(1.03); }

#art-img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

#art-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem; opacity: 0.3;
}

/* Track info */
#track-info { text-align: center; width: 100%; max-width: 380px; }

#track-title {
  font-size: clamp(1.1rem, 2.2vw, 1.7rem);
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.3rem;
  letter-spacing: -0.02em;
}

#track-artist {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
}

/* Progress */
#progress-section { width: 100%; max-width: 420px; }

#progress-bar {
  width: 100%; height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  margin-bottom: 0.5rem;
}

#progress-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--c1), var(--c2));
  width: 0%; pointer-events: none;
  transition: width 0.1s linear;
  position: relative;
}

#progress-fill::after {
  content: '';
  position: absolute; right: -5px; top: -4px;
  width: 12px; height: 12px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px rgba(79,195,247,0.8);
  opacity: 0;
  transition: opacity 0.2s;
}

#progress-bar:hover #progress-fill::after { opacity: 1; }

.time-row {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 0.68rem;
  color: rgba(255,255,255,0.35);
}

/* Controls */
#controls {
  display: flex; align-items: center; gap: 1.2rem;
}

.ctrl-btn {
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.5);
  font-size: 1rem; line-height: 1;
  transition: color 0.15s, transform 0.15s;
  padding: 0.4rem;
  border-radius: 50%;
}

.ctrl-btn:hover { color: #fff; transform: scale(1.12); }

#btn-play {
  width: 58px; height: 58px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 0 20px rgba(110,72,170,0.3);
}

#btn-play:hover {
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 30px rgba(79,195,247,0.4);
  transform: scale(1.06);
}

.ctrl-btn.active { color: var(--c2); }

/* Volume */
#volume-row {
  display: flex; align-items: center; gap: 0.6rem;
  font-size: 0.9rem;
}

#vol-icon { color: rgba(255,255,255,0.4); font-size: 0.85rem; }

input[type="range"] {
  -webkit-appearance: none;
  height: 3px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px; outline: none; cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  background: #fff; border-radius: 50%;
  box-shadow: 0 0 6px rgba(79,195,247,0.6);
}

#vol-slider { width: 90px; }

/* ══════════════════════════════════════════════
   PLAYLIST PANEL
══════════════════════════════════════════════ */
#playlist-panel {
  grid-area: playlist;
  display: flex; flex-direction: column;
  overflow: hidden;
  padding: 1.2rem;
}

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem; flex-shrink: 0;
}

.panel-title {
  font-family: var(--mono);
  font-size: 0.68rem; letter-spacing: 2px;
  color: rgba(255,255,255,0.4); text-transform: uppercase;
}

#add-btn {
  width: 30px; height: 30px; border-radius: 8px;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--glass-border);
  color: rgba(255,255,255,0.6);
  cursor: pointer; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; position: relative;
}

#add-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
#file-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

#track-list {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 0.5rem;
  padding-right: 2px;
}

#track-list::-webkit-scrollbar { width: 3px; }
#track-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

.track-item {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.65rem 0.75rem; border-radius: 12px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  flex-shrink: 0;
}

.track-item:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.08); }

.track-item.active {
  background: rgba(110,72,170,0.2);
  border-color: rgba(110,72,170,0.35);
}

.track-thumb {
  width: 40px; height: 40px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0;
  background: rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; overflow: hidden;
}

.track-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

.track-meta { flex: 1; min-width: 0; }

.track-name {
  font-size: 0.82rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: rgba(255,255,255,0.9);
}

.track-artist-sm {
  font-family: var(--mono); font-size: 0.65rem;
  color: rgba(255,255,255,0.35);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 0.1rem;
}

.track-dur {
  font-family: var(--mono); font-size: 0.65rem;
  color: rgba(255,255,255,0.25); flex-shrink: 0;
}

.track-playing {
  width: 14px; flex-shrink: 0;
  display: flex; align-items: center; gap: 1px;
  height: 14px;
}

.track-playing span {
  display: block; width: 2px; background: var(--c2);
  border-radius: 1px; animation: eq 0.8s ease-in-out infinite;
}

.track-playing span:nth-child(2) { animation-delay: 0.15s; }
.track-playing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes eq {
  0%,100%{ height: 4px; } 50%{ height: 12px; }
}

.playlist-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0.5rem;
  color: rgba(255,255,255,0.15); text-align: center;
}

.playlist-empty-icon { font-size: 2rem; opacity: 0.4; }
.playlist-empty-text { font-family: var(--mono); font-size: 0.72rem; }

/* ══════════════════════════════════════════════
   SPECTROGRAM
══════════════════════════════════════════════ */
#spec-panel {
  grid-area: spec;
  height: 110px;
  padding: 0;
  overflow: hidden;
  position: relative;
}

#spec-canvas {
  width: 100%; height: 100%;
  display: block;
  border-radius: 20px;
}

#spec-label {
  position: absolute; left: 14px; top: 10px;
  font-family: var(--mono); font-size: 0.6rem;
  color: rgba(255,255,255,0.2); letter-spacing: 1.5px;
  text-transform: uppercase;
  pointer-events: none;
}

.freq-ticks {
  position: absolute; bottom: 8px; left: 0; right: 0;
  display: flex; justify-content: space-between;
  padding: 0 16px;
  pointer-events: none;
}

.freq-tick {
  font-family: var(--mono); font-size: 0.58rem;
  color: rgba(255,255,255,0.15);
}

/* ══════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════ */
@media (max-width: 820px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto auto;
    grid-template-areas: "player" "playlist" "spec";
    overflow-y: auto;
    height: auto; min-height: 100%;
  }
  #playlist-panel { max-height: 280px; }
  #spec-panel { height: 90px; }
  body { overflow: auto; }
  html, body { height: auto; }
}
</style>
</head>
<body>

<!-- BACKGROUND -->
<div id="bg">
  <div class="blob" id="blob1"></div>
  <div class="blob" id="blob2"></div>
  <div class="blob" id="blob3"></div>
</div>

<!-- APP -->
<div id="app">

  <!-- PLAYER -->
  <div class="glass" id="player-panel">
    <div id="art-wrap">
      <div id="art-ring"></div>
      <div id="art-mask">
        <div id="art-placeholder">🎵</div>
        <img id="art-img" style="display:none" alt="cover">
      </div>
    </div>

    <div id="track-info">
      <div id="track-title">Aucun titre</div>
      <div id="track-artist">— Artiste inconnu</div>
    </div>

    <div id="progress-section">
      <div id="progress-bar" onclick="seekTo(event)">
        <div id="progress-fill"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div id="controls">
      <button class="ctrl-btn" id="btn-shuffle" onclick="toggleShuffle()" title="Aléatoire">⇄</button>
      <button class="ctrl-btn" onclick="prevTrack()" title="Précédent">⏮</button>
      <button id="btn-play" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextTrack()" title="Suivant">⏭</button>
      <button class="ctrl-btn" id="btn-repeat" onclick="toggleRepeat()" title="Répéter">↻</button>
    </div>

    <div id="volume-row">
      <span id="vol-icon">🔈</span>
      <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.75" oninput="setVol(this.value)">
    </div>
  </div>

  <!-- PLAYLIST -->
  <div class="glass" id="playlist-panel">
    <div class="panel-header">
      <span class="panel-title">Playlist</span>
      <div id="add-btn" title="Ajouter des fichiers">
        <input type="file" id="file-input" accept=".mp3,.wav,audio/*" multiple onchange="addFiles(this.files)">
        +
      </div>
    </div>
    <div id="track-list">
      <div class="playlist-empty" id="empty-state">
        <span class="playlist-empty-icon">🎶</span>
        <span class="playlist-empty-text">Clique sur + pour<br>ajouter des fichiers</span>
      </div>
    </div>
  </div>

  <!-- SPECTROGRAM -->
  <div class="glass" id="spec-panel">
    <canvas id="spec-canvas"></canvas>
    <div id="spec-label">spectrogram</div>
    <div class="freq-ticks">
      <span class="freq-tick">20Hz</span>
      <span class="freq-tick">100Hz</span>
      <span class="freq-tick">500Hz</span>
      <span class="freq-tick">2kHz</span>
      <span class="freq-tick">8kHz</span>
      <span class="freq-tick">20kHz</span>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
const state = {
  playlist: [],
  current: -1,
  playing: false,
  shuffle: false,
  repeat: false,
};

let audioCtx, analyser, gainNode, sourceNode;
let audioEl = new Audio();
audioEl.volume = 0.75;
audioEl.crossOrigin = 'anonymous';

// ══════════════════════════════════════
// AUDIO CONTEXT SETUP
// ══════════════════════════════════════
function ensureAudioCtx() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.85;
  gainNode = audioCtx.createGain();
  gainNode.gain.value = audioEl.volume;
  sourceNode = audioCtx.createMediaElementSource(audioEl);
  sourceNode.connect(gainNode);
  gainNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

// ══════════════════════════════════════
// FILE LOADING & METADATA
// ══════════════════════════════════════
function addFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('audio/')) return;
    const entry = {
      file,
      url: URL.createObjectURL(file),
      title: stripExt(file.name),
      artist: 'Artiste inconnu',
      cover: null,
      duration: 0,
    };
    state.playlist.push(entry);
    const idx = state.playlist.length - 1;
    renderTrackItem(idx);
    readMeta(file, idx);
  });
  document.getElementById('empty-state')?.remove();
  if (state.current === -1) loadTrack(0);
}

function stripExt(name) {
  return name.replace(/\.[^/.]+$/, '');
}

function readMeta(file, idx) {
  if (typeof jsmediatags === 'undefined') return;
  jsmediatags.read(file, {
    onSuccess(tag) {
      const t = tag.tags;
      const entry = state.playlist[idx];
      if (t.title) entry.title = t.title;
      if (t.artist) entry.artist = t.artist;
      if (t.picture) {
        const { data, format } = t.picture;
        const bytes = new Uint8Array(data);
        const blob = new Blob([bytes], { type: format });
        entry.cover = URL.createObjectURL(blob);
      }
      updateTrackItem(idx);
      if (state.current === idx) updatePlayerUI(idx);
    },
    onError() {}
  });
}

function getDuration(url) {
  return new Promise(res => {
    const a = new Audio();
    a.src = url;
    a.onloadedmetadata = () => res(a.duration);
    a.onerror = () => res(0);
  });
}

// ══════════════════════════════════════
// PLAYBACK
// ══════════════════════════════════════
function loadTrack(idx) {
  if (idx < 0 || idx >= state.playlist.length) return;
  const entry = state.playlist[idx];
  state.current = idx;
  audioEl.src = entry.url;
  audioEl.load();
  updatePlayerUI(idx);
  updateActiveItem();
  if (state.playing) {
    ensureAudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioEl.play().catch(() => {});
  }
}

function togglePlay() {
  ensureAudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (state.current === -1 && state.playlist.length > 0) { state.playing = true; loadTrack(0); return; }
  if (audioEl.paused) {
    audioEl.play().then(() => { state.playing = true; updatePlayBtn(); });
  } else {
    audioEl.pause();
    state.playing = false;
    updatePlayBtn();
  }
}

function prevTrack() {
  if (!state.playlist.length) return;
  if (audioEl.currentTime > 3) { audioEl.currentTime = 0; return; }
  const idx = state.shuffle ? randIdx() : (state.current - 1 + state.playlist.length) % state.playlist.length;
  state.playing = true;
  loadTrack(idx);
}

function nextTrack() {
  if (!state.playlist.length) return;
  const idx = state.shuffle ? randIdx() : (state.current + 1) % state.playlist.length;
  state.playing = true;
  loadTrack(idx);
}

function randIdx() {
  if (state.playlist.length === 1) return 0;
  let r; do { r = Math.floor(Math.random() * state.playlist.length); } while (r === state.current);
  return r;
}

function toggleShuffle() {
  state.shuffle = !state.shuffle;
  document.getElementById('btn-shuffle').classList.toggle('active', state.shuffle);
}

function toggleRepeat() {
  state.repeat = !state.repeat;
  document.getElementById('btn-repeat').classList.toggle('active', state.repeat);
}

function setVol(v) {
  audioEl.volume = v;
  if (gainNode) gainNode.gain.value = v;
  document.getElementById('vol-icon').textContent = v < 0.01 ? '🔇' : v < 0.5 ? '🔉' : '🔊';
}

function seekTo(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if (audioEl.duration) audioEl.currentTime = ratio * audioEl.duration;
}

// Events
audioEl.addEventListener('timeupdate', () => {
  if (!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('time-cur').textContent = fmt(audioEl.currentTime);
});

audioEl.addEventListener('loadedmetadata', () => {
  document.getElementById('time-total').textContent = fmt(audioEl.duration);
  if (state.current >= 0) state.playlist[state.current].duration = audioEl.duration;
  updateTrackItem(state.current);
});

audioEl.addEventListener('play', () => {
  state.playing = true;
  updatePlayBtn();
  document.getElementById('art-ring').classList.add('spinning');
});

audioEl.addEventListener('pause', () => {
  state.playing = false;
  updatePlayBtn();
  document.getElementById('art-ring').classList.remove('spinning');
});

audioEl.addEventListener('ended', () => {
  if (state.repeat) { audioEl.currentTime = 0; audioEl.play(); return; }
  nextTrack();
});

function fmt(s) {
  s = Math.max(0, s || 0);
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2,'0')}`;
}

// ══════════════════════════════════════
// UI UPDATES
// ══════════════════════════════════════
function updatePlayBtn() {
  document.getElementById('btn-play').textContent = state.playing ? '⏸' : '▶';
}

function updatePlayerUI(idx) {
  const e = state.playlist[idx];
  document.getElementById('track-title').textContent = e.title || 'Sans titre';
  document.getElementById('track-artist').textContent = '— ' + (e.artist || 'Artiste inconnu');
  const img = document.getElementById('art-img');
  const ph  = document.getElementById('art-placeholder');
  if (e.cover) {
    img.src = e.cover;
    img.style.display = 'block';
    ph.style.display = 'none';
    setBlobColors(e.cover);
  } else {
    img.style.display = 'none';
    ph.style.display = 'flex';
    resetBlobColors();
  }
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('time-cur').textContent = '0:00';
  document.getElementById('time-total').textContent = fmt(audioEl.duration);
}

// ── Dynamic blob colors from album art ──
function setBlobColors(src) {
  const cvs = document.createElement('canvas');
  const imgEl = new Image();
  imgEl.crossOrigin = 'anonymous';
  imgEl.onload = () => {
    cvs.width = cvs.height = 16;
    const c = cvs.getContext('2d');
    c.drawImage(imgEl, 0, 0, 16, 16);
    const d = c.getImageData(0, 0, 16, 16).data;
    let r=0,g=0,b=0,cnt=0;
    for (let i=0;i<d.length;i+=4){ r+=d[i];g+=d[i+1];b+=d[i+2];cnt++; }
    r=Math.round(r/cnt); g=Math.round(g/cnt); b=Math.round(b/cnt);
    const c1=`rgb(${r},${g},${b})`;
    const c2=`rgb(${255-r},${255-g},${b})`;
    const c3=`rgb(${r},${255-g},${255-b})`;
    document.getElementById('blob1').style.background = c1;
    document.getElementById('blob2').style.background = c2;
    document.getElementById('blob3').style.background = c3;
    document.documentElement.style.setProperty('--c1', c1);
    document.documentElement.style.setProperty('--c2', c2);
    document.documentElement.style.setProperty('--c3', c3);
  };
  imgEl.src = src;
}

function resetBlobColors() {
  document.getElementById('blob1').style.background = '#6e48aa';
  document.getElementById('blob2').style.background = '#4fc3f7';
  document.getElementById('blob3').style.background = '#f472b6';
  document.documentElement.style.setProperty('--c1','#6e48aa');
  document.documentElement.style.setProperty('--c2','#4fc3f7');
  document.documentElement.style.setProperty('--c3','#f472b6');
}

// ══════════════════════════════════════
// PLAYLIST UI
// ══════════════════════════════════════
function renderTrackItem(idx) {
  const e = state.playlist[idx];
  const list = document.getElementById('track-list');
  const div = document.createElement('div');
  div.className = 'track-item';
  div.id = `ti-${idx}`;
  div.onclick = () => { state.playing = true; loadTrack(idx); };
  div.innerHTML = trackItemHTML(e, idx);
  list.appendChild(div);
}

function updateTrackItem(idx) {
  const el = document.getElementById(`ti-${idx}`);
  if (!el) return;
  const e = state.playlist[idx];
  el.innerHTML = trackItemHTML(e, idx);
  updateActiveItem();
}

function trackItemHTML(e, idx) {
  const thumb = e.cover
    ? `<div class="track-thumb"><img src="${e.cover}" alt=""></div>`
    : `<div class="track-thumb">🎵</div>`;
  const dur = e.duration ? `<span class="track-dur">${fmt(e.duration)}</span>` : '';
  const eq = idx === state.current && state.playing
    ? `<div class="track-playing"><span></span><span></span><span></span></div>`
    : '';
  return `${thumb}
    <div class="track-meta">
      <div class="track-name">${e.title}</div>
      <div class="track-artist-sm">${e.artist}</div>
    </div>
    ${dur}${eq}`;
}

function updateActiveItem() {
  document.querySelectorAll('.track-item').forEach((el, i) => {
    el.classList.toggle('active', i === state.current);
    // refresh eq animation
    const eq = el.querySelector('.track-playing');
    if (eq) { eq.remove(); }
    if (i === state.current && state.playing) {
      const eqEl = document.createElement('div');
      eqEl.className = 'track-playing';
      eqEl.innerHTML = '<span></span><span></span><span></span>';
      el.appendChild(eqEl);
    }
  });
}

// ══════════════════════════════════════
// SPECTROGRAM DRAW
// ══════════════════════════════════════
const specCanvas = document.getElementById('spec-canvas');
const specCtx = specCanvas.getContext('2d');

function resizeSpec() {
  const wrap = specCanvas.parentElement;
  specCanvas.width = wrap.offsetWidth;
  specCanvas.height = wrap.offsetHeight;
}

window.addEventListener('resize', resizeSpec);
resizeSpec();

function drawSpec() {
  requestAnimationFrame(drawSpec);
  resizeSpec();
  const W = specCanvas.width, H = specCanvas.height;

  specCtx.clearRect(0, 0, W, H);
  // Glass bg — transparent, let panel show through
  specCtx.fillStyle = 'rgba(0,0,0,0)';
  specCtx.fillRect(0, 0, W, H);

  if (!analyser) {
    drawIdleSpec(W, H);
    return;
  }

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);

  const bins = Math.min(data.length, 256);
  const barW = (W / bins) - 0.5;
  const usableH = H - 20;

  for (let i = 0; i < bins; i++) {
    const v = data[i] / 255;
    if (v < 0.01) continue;
    const bH = v * usableH;
    const x = i * (barW + 0.5);

    // Color: bass=purple, mids=cyan, highs=pink
    const t = i / bins;
    let r, g, b;
    if (t < 0.33) {
      r = 110 + t * 3 * (79-110);
      g = 72  + t * 3 * (195-72);
      b = 170 + t * 3 * (247-170);
    } else if (t < 0.66) {
      const tt = (t - 0.33) * 3;
      r = 79  + tt * (244-79);
      g = 195 + tt * (114-195);
      b = 247 + tt * (182-247);
    } else {
      r = 244; g = 114; b = 182;
    }

    const alpha = 0.4 + v * 0.6;
    const grad = specCtx.createLinearGradient(0, H - 20 - bH, 0, H - 20);
    grad.addColorStop(0,   `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(0.7, `rgba(${r},${g},${b},${alpha * 0.6})`);
    grad.addColorStop(1,   `rgba(${r},${g},${b},0.05)`);

    specCtx.fillStyle = grad;
    specCtx.beginPath();
    specCtx.roundRect(x, H - 20 - bH, barW, bH, [1.5, 1.5, 0, 0]);
    specCtx.fill();

    // Glow cap
    if (v > 0.15) {
      specCtx.fillStyle = `rgba(${r},${g},${b},${v * 0.8})`;
      specCtx.fillRect(x, H - 21 - bH, barW, 1.5);
    }
  }

  // Reactive blobs scale
  const avgEnergy = Array.from(data.slice(0,64)).reduce((a,b)=>a+b,0)/64/255;
  document.getElementById('blob1').style.transform = `scale(${1 + avgEnergy * 0.4})`;
  document.getElementById('blob3').style.transform = `scale(${1 + avgEnergy * 0.25})`;
}

function drawIdleSpec(W, H) {
  // Flat noise line
  specCtx.strokeStyle = 'rgba(255,255,255,0.06)';
  specCtx.lineWidth = 1;
  specCtx.beginPath();
  specCtx.moveTo(0, H / 2);
  for (let x = 0; x < W; x += 4) {
    specCtx.lineTo(x, H / 2 + (Math.random() * 4 - 2));
  }
  specCtx.stroke();
}

drawSpec();

// ══════════════════════════════════════
// KEYBOARD SHORTCUTS
// ══════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { if(audioEl.duration) audioEl.currentTime = Math.min(audioEl.currentTime+5, audioEl.duration); }
  if (e.code === 'ArrowLeft')  { audioEl.currentTime = Math.max(audioEl.currentTime-5, 0); }
  if (e.code === 'ArrowUp')    { const v=Math.min(audioEl.volume+0.05,1); audioEl.volume=v; document.getElementById('vol-slider').value=v; setVol(v); }
  if (e.code === 'ArrowDown')  { const v=Math.max(audioEl.volume-0.05,0); audioEl.volume=v; document.getElementById('vol-slider').value=v; setVol(v); }
  if (e.code === 'KeyN') nextTrack();
  if (e.code === 'KeyP') prevTrack();
});
</script>
