<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs – Maxlware</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    :root {
      --primary: #6e48aa;
      --secondary: #9d50bb;
      --accent: #4fc3f7;
      --dark: #0e0e11;
      --surface: #111217;
      --border: #1e1e28;
      --light: #ffffff;
      --muted: #888;
      --mono: 'Syne Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--light);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .page-tag {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--secondary);
      letter-spacing: 2px;
      display: block;
      margin-bottom: 0.4rem;
      opacity: 0.8;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: var(--mono);
      margin-bottom: 2rem;
    }

    .jobs-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-bottom: 3rem;
    }

    .job-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.9rem 1.1rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .job-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .job-item:hover {
      border-color: #2a2a3a;
      transform: translateY(-2px);
    }

    .job-item:hover::before { opacity: 1; }

    .job-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
    }

    .job-info { flex: 1; }

    .job-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--light);
      display: block;
    }

    .job-meta {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.15rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .job-arrow {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--muted);
      transition: color 0.2s, transform 0.2s;
    }

    .job-item:hover .job-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    .apply-section {
      margin-top: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .apply-title {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 0.4rem;
      color: var(--muted);
    }

    .form-control {
      width: 100%;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.8rem 1rem;
      font-family: var(--sans);
      font-size: 0.85rem;
      color: var(--light);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    select.form-control {
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat: no-repeat;
      background-position: right 1rem center;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 6px;
      padding: 0.8rem;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer-note {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: #333;
      text-align: center;
      margin-top: 2rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      padding: 1rem;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .tally-modal {
      background: var(--surface);
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      width: 100%;
      max-width: 700px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(12px) scale(0.97);
      transition: transform 0.2s;
      box-shadow: 0 0 60px rgba(110,72,170,0.2);
    }

    .modal-overlay.show .tally-modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
    }

    .modal-header h3 {
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }
    .modal-close:hover { color: var(--light); }

    .modal-content {
      flex: 1;
      padding: 0;
      min-height: 500px;
      overflow-y: auto;
    }

    .modal-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      min-height: 500px;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .job-meta { flex-direction: column; gap: 0.2rem; }
      .tally-modal { max-width: 95%; }
      .modal-content iframe { min-height: 70vh; }
    }
  </style>
</head>
<body>
<div class="container">
  <span class="page-tag">✦ REJOIGNEZ L'ÉQUIPE</span>
  <h1>Jobs @ Maxlware</h1>
  <div class="subtitle">Sélectionnez un poste pour postuler via un formulaire dédié</div>

  <div class="jobs-list">
    <div class="job-item" data-tally="https://tally.so/r/A7xGEe">
      <div class="job-icon">🎨</div>
      <div class="job-info">
        <span class="job-title">Développeur·se Full Stack</span>
        <div class="job-meta"><span>💼 Bénévole</span></div>
      </div>
      <div class="job-arrow">→</div>
    </div>
  </div>
  <div class="footer-note">Toutes les candidatures sont examinées avec soin. Nous vous répondons sous 7 jours.</div>
</div>

<div id="tallyModal" class="modal-overlay">
  <div class="tally-modal">
    <div class="modal-header">
      <h3>Postuler via Tally</h3>
      <button class="modal-close" id="closeTallyModal">&times;</button>
    </div>
    <div class="modal-content">
      <iframe id="tallyIframe" src="" frameborder="0" loading="lazy"></iframe>
    </div>
  </div>
</div>

<script>
  const modal = document.getElementById('tallyModal');
  const tallyIframe = document.getElementById('tallyIframe');
  const closeBtn = document.getElementById('closeTallyModal');

  function closeModal() {
    modal.classList.remove('show');
    tallyIframe.src = '';
  }

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  document.querySelectorAll('.job-item').forEach(item => {
    item.addEventListener('click', () => {
      const tallyUrl = item.getAttribute('data-tally');
      if (tallyUrl) {
        tallyIframe.src = tallyUrl;
        modal.classList.add('show');
      }
    });
  });

  const form = document.getElementById('jobForm');
  const modalMessage = document.createElement('div');
  const applySection = document.querySelector('.apply-section');

  function showMessage(message, isError = false) {
    const msgDiv = document.createElement('div');
    msgDiv.textContent = message;
    msgDiv.style.position = 'fixed';
    msgDiv.style.bottom = '20px';
    msgDiv.style.left = '50%';
    msgDiv.style.transform = 'translateX(-50%)';
    msgDiv.style.background = isError ? '#e74c3c' : '#2ecc71';
    msgDiv.style.color = 'white';
    msgDiv.style.padding = '12px 24px';
    msgDiv.style.borderRadius = '50px';
    msgDiv.style.fontFamily = 'var(--mono)';
    msgDiv.style.fontSize = '0.8rem';
    msgDiv.style.zIndex = '2000';
    msgDiv.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
    document.body.appendChild(msgDiv);
    setTimeout(() => msgDiv.remove(), 3000);
  }
</script>
</body>
</html>
