<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxlware - Crédits</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0e0e11;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;

    .iframe-container {
      width: 100%;
      max-width: 800px;
      margin: 20px;

      border-radius: 12px;

    }
    iframe {
      width: 100%;
      height: 80vh;
      border: none;

<body>
  <div class="iframe-container">
    <iframe
      src="https://tally.so/embed/Y5rBBv?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"

      frameborder="0"
      loading="lazy"
    ></iframe>
  </div>
</body>
