<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxlware -</title>
  <link rel="icon" href="assets/logo.png">

  <meta name="description" content="Official website of Maxlware." />

  <meta property="og:title" content="Maxlware - Independent developer in France.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://maxlware.com/">
  <meta property="og:description" content="Independent developer in France. - Specialized in coding and content creation.">
  <meta property="og:site_name" content="Maxlware">
  <meta property="og:locale" content="fr_FR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Maxlware - Independent developer in France.">
  <meta name="twitter:description" content="Independent developer in France. - Specialized in coding and content creation.">
  
  <link rel="canonical" href="https://maxlware.com/">

  <style>
    body {
      font-family: "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      margin: 0;
      background: #000;
      color: #fff;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: url('assets/loading.png') no-repeat center center fixed;
      background-size: cover;
      z-index: 10000;
    }

    #loading-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
    }
  </style>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const overlay = document.getElementById('loading-overlay');
  if (overlay) overlay.style.display = 'block';

  fetch('/v1/stats/visits/global', { method: 'POST' });
  fetch('/v1/stats/visits/site?site=maxlware.com', { method: 'POST' });

  try {
    const params = new URLSearchParams(window.location.search);
    const utmSource = params.get("utm_source");
    const linkParam = params.get("link");

    if (utmSource) {
      try {
        await fetch("https://api.maxlware.com/v1/ad/utm-edit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source: utmSource,
            user_agent: navigator.userAgent
          })
        });
      } catch (e) {
        console.error("UTM tracking failed:", e);
      }
    }

    const res = await fetch("https://api.maxlware.com/v1/com/access", {
      cache: "no-store"
    });

    const data = await res.json();

    if (data.com_access === "false") {
      return setTimeout(() => {
        window.location.href = "maintenance.html";
      }, 1000);
    }

    const routes = {
      contact: "fr-fr/contact.html?ref=index",
      discord: "https://discord.maxlware.com?ref=index",
      jobs: "jobs.html?ref=index",
      github: "https://github.com/maxlware-fr?ref=index"
    };

    const lang = navigator.language.toLowerCase();
    let target = lang.startsWith("fr") ? "fr_fr.html" : "en_en.html";

    if (linkParam && routes[linkParam]) {
      target = routes[linkParam];
    }

    setTimeout(() => {
      window.location.href = target;
    }, 1000);

  } catch (e) {
    setTimeout(() => {
      window.location.href = "maintenance.html";
    }, 1000);
  }
});
</script>

</head>
<body>

<div id="loading-overlay"></div>

<noscript>
  <style>
    body { color: #f33; text-align:center; }
  </style>
  <img src="assets/error.jpg" alt="logo"><br>
  Javascript is not enabled.<br>
  JavaScript n’est pas activé.
</noscript>

</body>
</html>
