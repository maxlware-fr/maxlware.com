<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxlware -</title>
  <link rel="icon" href="assets/logo.png">

  <meta name="description" content="Official website of Maxlware." />

  <meta property="og:title" content="Maxlware - Independent developer in France.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://maxlware.com/">
  <meta property="og:description" content="Independent developer in France. - Specialized in coding and content creation.">
  <meta property="og:site_name" content="Maxlware">
  <meta property="og:locale" content="fr_FR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Maxlware - Independent developer in France.">
  <meta name="twitter:description" content="Independent developer in France. - Specialized in coding and content creation.">
  
  <link rel="canonical" href="https://maxlware.com/">

  <style>
    body {
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      margin: 0;
      background: #000;
      color: #fff;
      text-align: center;
    }
    img {
      max-width: 100px;
      margin-bottom: 10px;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('assets/loading.png') no-repeat center center fixed;
      background-size: cover;
      z-index: 10000;
      display: none;
    }
    #loading-overlay::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
  </style>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const loadingOverlay = document.getElementById('loading-overlay');
    if (loadingOverlay) {
      loadingOverlay.style.display = 'block';
    }

    try {
      const params = new URLSearchParams(window.location.search);
      const utmSource = params.get("utm_source");

      if (utmSource) {
        try {
          await fetch("https://api.maxlware.com/v1/ad/utm-edit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              source: utmSource,
              user_agent: navigator.userAgent
            })
          });
        } catch (utmError) {
          console.error("UTM tracking failed:", utmError);
        }
      }
      const res = await fetch("https://api.maxlware.com/v1/com/access", {
        cache: "no-store"
      });

      const data = await res.json();

      if (data.com_access === "false") {
        setTimeout(() => {
          window.location.href = "maintenance.html";
        }, 1000);
        return;
      }
      const lang = navigator.language.toLowerCase();
      const target = lang.startsWith("fr") ? "fr-fr.html" : "en-en.html";

      setTimeout(() => {
        window.location.href = target;
      }, 1000);

    } catch (e) {
      setTimeout(() => {
        window.location.href = "maintenance.html";
      }, 1000);
    }
  });
</script>
</head>
<body>
  <div id="loading-overlay"></div>

  <noscript>
    <style>
      body { color: #f33; }
    </style>
    <img src="assets/error.jpg" alt="logo"><br>
    Javascript is not enabled. Please enable it.<br>
    JavaScript n’est pas activé. Active-le pour continuer.
  </noscript>
</body>
</html>
